[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "annotete"
version = "0.1.0"
description = "Local, browser-based annotation tool (multi-object tracking first)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "opencv-python"]

[project.scripts]
annotete = "annotete.cli:main"

[tool.setuptools.packages.find]
include = ["annotete*"]

[tool.setuptools.package-data]
annotete = ["web/*.html", "web/css/*", "web/js/*.js", "web/js/tasks/*/*.js"]
